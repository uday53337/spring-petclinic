trigger:
  branches:
    include:
      - main

variables:
  imageName: 'my-java-app'
  dockerfilePath: 'Dockerfile'
  acrName: 'myacr'                        # ACR name without .azurecr.io
  acrLoginServer: 'myacr.azurecr.io'
  aksResourceGroup: 'my-aks-rg'
  aksClusterName: 'my-aks-cluster'
  namespace: 'default'
  tag: '$(Build.BuildId)'

stages:

- stage: Build
  displayName: "Build and Push Docker Image"
  jobs:
  - job: BuildPush
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: Maven@3
      displayName: "Maven Build"
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'clean package -DskipTests'

    - task: Docker@2
      displayName: "Build and Push Image to ACR"
      inputs:
        command: buildAndPush
        containerRegistry: 'ACR-Service-Connection'   # Registry Service Connection
        repository: '$(acrLoginServer)/$(imageName)'
        dockerfile: '$(dockerfilePath)'
        tags: |
          $(tag)

- stage: Deploy
  displayName: "Deploy to AKS"
  dependsOn: Build
  jobs:
  - job: DeployToAKS
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - task: AzureCLI@2
      displayName: "Deploy using kubectl"
      inputs:
        azureSubscription: 'Azure-Service-Connection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az aks get-credentials -g $(aksResourceGroup) -n $(aksClusterName) --overwrite-existing
          kubectl set image deployment/my-java-deployment my-java-container=$(acrLoginServer)/$(imageName):$(tag) -n $(namespace) || \
          kubectl apply -f k8s/deployment.yaml -n $(namespace)
